<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0d0d18"/>
<title>ZAM World Map</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d18;--road:#141420;
  --mk1:#d97706;--mk1b:#92400e;
  --mk2:#7c3aed;--mk2b:#4c1d95;
  --mk3:#059669;--mk3b:#064e3b;
  --mk4:#2563eb;--mk4b:#1e3a8a;
  --pr:#8b5cf6;--font:'Poppins',system-ui,sans-serif;
  --sidebar:56px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:#e2e8f0;user-select:none}
button{cursor:pointer;font-family:var(--font);border:none;background:none;color:inherit}
#app{position:fixed;inset:0;display:flex}
/* SIDEBAR */
#sidebar{width:var(--sidebar);flex-shrink:0;background:rgba(10,10,22,0.97);border-right:1px solid rgba(139,92,246,0.15);display:flex;flex-direction:column;align-items:center;padding-top:max(14px,env(safe-area-inset-top,14px));padding-bottom:max(12px,env(safe-area-inset-bottom,12px));z-index:100}
.sb-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:#fff;margin-bottom:20px}
.sb-nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.sb-btn{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .15s;position:relative}
.sb-btn:active,.sb-btn.active{background:rgba(139,92,246,0.2)}
.sb-btn.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--pr)}
.sb-icon{font-size:1.1rem}.sb-lbl{font-size:0.42rem;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:0.02em}
.sb-btn.active .sb-lbl{color:rgba(167,139,250,0.8)}
.sb-profile{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6d28d9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;color:#fff;border:2px solid rgba(139,92,246,0.5)}
/* MAP AREA */
#map-area{flex:1;position:relative;overflow:hidden}
/* TOPBAR */
#topbar{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top,10px)) 12px 10px;background:linear-gradient(to bottom,rgba(13,13,24,0.98) 50%,transparent);pointer-events:none}
.tb-title{flex:1}.tb-title-main{font-size:0.8rem;font-weight:800;color:#fff;letter-spacing:0.03em;display:block}
.tb-online{font-size:0.58rem;color:#34d399;font-weight:600;display:flex;align-items:center;gap:3px;margin-top:1px}
.tb-online::before{content:'';width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block}
.tb-btn{pointer-events:all;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:rgba(255,255,255,0.7)}
#nudge-bell{position:relative}
#nudge-badge{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #0d0d18;display:none}
/* MAP STAGE */
#map-wrap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#map-wrap:active{cursor:grabbing}
#map-stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#map-svg{display:block;width:520px;height:800px}
#user-layer,#marker-layer{position:absolute;top:0;left:0;width:520px;height:800px;pointer-events:none}
.user-bubble,.map-marker{pointer-events:all}
/* USER BUBBLES */
.user-bubble{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);cursor:pointer;z-index:20;transition:transform .12s}
.user-bubble:active{transform:translate(-50%,-100%) scale(0.88)}
.av-wrap{position:relative;width:40px;height:40px}
.av-ring{position:absolute;inset:0;border-radius:50%;padding:2.5px;background:conic-gradient(from 0deg,#6d28d9,#a78bfa,#8b5cf6,#6d28d9);animation:ringRot 3s linear infinite}
.user-bubble.is-own .av-ring{background:conic-gradient(from 0deg,#065f46,#34d399,#10b981,#065f46)}
.av-img{position:absolute;inset:2.5px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:#fff}
.av-online{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#34d399;border:2px solid #0d0d18}
.user-chip{margin-top:4px;background:rgba(6,6,18,0.92);backdrop-filter:blur(10px);border:1px solid rgba(139,92,246,0.35);border-radius:10px;padding:2px 8px;font-size:0.54rem;font-weight:600;color:#c4b5fd;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.user-name{font-size:0.5rem;color:rgba(255,255,255,0.45);font-weight:600;margin-top:2px}
@keyframes ringRot{to{transform:rotate(360deg)}}
/* MARKERS */
.map-marker{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);cursor:pointer;z-index:15}
.mk-pin{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.9rem;border:2px solid rgba(255,255,255,0.2);box-shadow:0 2px 12px rgba(0,0,0,0.5)}
.mk-pulse{position:absolute;inset:-8px;border-radius:50%;border:2px solid;animation:mkP 2s ease-out infinite;opacity:0}
@keyframes mkP{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.8);opacity:0}}
.mk-lbl{margin-top:3px;font-size:0.5rem;font-weight:700;background:rgba(3,3,9,0.88);border-radius:6px;padding:1px 5px;white-space:nowrap;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08)}
/* ZOOM */
#zoom-ctrl{position:absolute;right:10px;bottom:80px;z-index:50;display:flex;flex-direction:column;gap:6px}
.z-btn{width:36px;height:36px;border-radius:11px;background:rgba(13,13,24,0.92);border:1px solid rgba(255,255,255,0.1);color:#e2e8f0;font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(16px)}
#locate-btn{width:36px;height:36px;border-radius:11px;background:rgba(139,92,246,0.25);border:1px solid rgba(139,92,246,0.45);color:#a78bfa;font-size:1rem;display:flex;align-items:center;justify-content:center}
/* STATUS BAR */
#status-bar{position:absolute;bottom:0;left:0;right:0;z-index:50;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));background:linear-gradient(to top,rgba(13,13,24,0.98) 60%,transparent)}
#st-pill{display:flex;align-items:center;gap:8px;background:rgba(20,20,35,0.95);border:1px solid rgba(139,92,246,0.25);border-radius:14px;padding:8px 12px;backdrop-filter:blur(20px);cursor:pointer}
.st-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.62rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#6d28d9,#8b5cf6);border:1.5px solid rgba(139,92,246,0.6)}
#st-text{flex:1;font-size:0.72rem;color:#c4b5fd;font-weight:500}
.st-chev{color:var(--pr);font-size:0.7rem}
#st-expanded{display:none;margin-top:8px;background:rgba(20,20,35,0.95);border:1px solid rgba(139,92,246,0.25);border-radius:14px;padding:12px;backdrop-filter:blur(20px)}
.st-row{display:flex;gap:6px;margin-bottom:8px}
.st-sel{flex:1;background:rgba(18,18,36,0.9);border:1px solid rgba(139,92,246,0.3);color:#c4b5fd;border-radius:9px;padding:6px 8px;font-size:0.66rem;font-family:var(--font);font-weight:600;outline:none}
.st-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.stchip{background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.25);border-radius:18px;padding:3px 10px;font-size:0.62rem;color:#c4b5fd;font-weight:600}
.stchip:active{background:rgba(139,92,246,0.25)}
.btn-save{width:100%;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;border-radius:9px;padding:7px;font-size:0.74rem;font-weight:700}
/* POPUP */
#popup-bg{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background .25s}
#popup-bg.open{display:flex;background:rgba(0,0,0,0.65)}
.pop-sheet{width:100%;max-width:480px;background:#0f0f1e;border-radius:22px 22px 0 0;border-top:1px solid rgba(139,92,246,0.3);padding:10px 18px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom,24px));transform:translateY(100%);transition:transform .3s cubic-bezier(0.16,1,0.3,1)}
#popup-bg.open .pop-sheet{transform:translateY(0)}
.pop-handle{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,0.12);margin:0 auto 14px}
/* CONSENT */
#consent{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.85);display:flex;align-items:flex-end;justify-content:center}
.consent-sheet{width:100%;max-width:480px;background:#0f0f1e;border-radius:22px 22px 0 0;border-top:1px solid rgba(139,92,246,0.3);padding:20px 20px 32px}
.consent-sheet h2{font-size:1rem;font-weight:700;margin-bottom:8px}
.consent-sheet p{font-size:0.72rem;color:rgba(255,255,255,0.55);line-height:1.55;margin-bottom:16px}
.btn-consent-ok{width:100%;background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;border-radius:12px;padding:12px;font-size:0.85rem;font-weight:700;margin-bottom:8px}
.btn-consent-no{width:100%;color:rgba(255,255,255,0.4);font-size:0.78rem;font-weight:600;padding:8px}
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sb-logo">Z</div>
    <div class="sb-nav">
      <button class="sb-btn active" data-panel="map" onclick="sbNav(this,'map')">
        <span class="sb-icon">🗺️</span><span class="sb-lbl">Karte</span>
      </button>
      <button class="sb-btn" data-panel="events" onclick="sbNav(this,'events')">
        <span class="sb-icon">🎉</span><span class="sb-lbl">Events</span>
      </button>
      <button class="sb-btn" data-panel="deals" onclick="sbNav(this,'deals')">
        <span class="sb-icon">🏷️</span><span class="sb-lbl">Deals</span>
      </button>
      <button class="sb-btn" data-panel="community" onclick="sbNav(this,'community')">
        <span class="sb-icon">👥</span><span class="sb-lbl">Community</span>
      </button>
    </div>
    <div class="sb-profile" id="sb-av">JM</div>
  </nav>

  <!-- MAP AREA -->
  <div id="map-area">
    <div id="topbar">
      <div class="tb-title">
        <span class="tb-title-main">ZAM WORLD MAP</span>
        <span class="tb-online" id="tb-online">32 Freunde online</span>
      </div>
      <button class="tb-btn">⚙️</button>
      <button class="tb-btn" id="nudge-bell" onclick="openNudgeInbox()">🔔<span id="nudge-badge"></span></button>
    </div>

    <div id="map-wrap">
      <div id="map-stage">
        <svg id="map-svg" viewBox="0 0 520 800" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
              <path d="M18 0H0V18" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
            </pattern>
            <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="glow-sm"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="shadow"><feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="rgba(0,0,0,0.6)"/></filter>
            <radialGradient id="hm-or" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/><stop offset="100%" stop-color="#d97706" stop-opacity="0"/></radialGradient>
            <radialGradient id="hm-pu" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
            <radialGradient id="hm-gr" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#059669" stop-opacity="0.35"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></radialGradient>
            <radialGradient id="hm-bl" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
          </defs>

          <!-- HINTERGRUND -->
          <rect width="520" height="800" fill="#111120"/>
          <rect width="520" height="800" fill="url(#grid)"/>

          <!-- HELMUT-SCHMIDT-ALLEE (oben) -->
          <rect x="0" y="0" width="520" height="50" fill="#141420"/>
          <line x1="0" y1="25" x2="520" y2="25" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="20,14"/>
          <text x="260" y="22" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.32)" font-family="Poppins,system-ui" font-weight="600" letter-spacing="0.1em">HELMUT-SCHMIDT-ALLEE</text>

          <!-- BILDUNGSCAMPUS (links) -->
          <rect x="0" y="50" width="38" height="470" fill="#141420"/>
          <text x="19" y="280" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.22)" font-family="Poppins,system-ui" font-weight="600" letter-spacing="0.08em" transform="rotate(-90,19,280)">BILDUNGSCAMPUS</text>

          <!-- BODENSEESTRASSE (unten) -->
          <rect x="0" y="750" width="520" height="50" fill="#141420"/>
          <line x1="0" y1="775" x2="520" y2="775" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="20,14"/>
          <text x="320" y="768" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.3)" font-family="Poppins,system-ui" font-weight="600" letter-spacing="0.1em">BODENSEESTRASSE</text>

          <!-- WIESENTFELSER STRASSE (rechts) -->
          <rect x="490" y="440" width="30" height="310" fill="#141420"/>
          <text x="505" y="600" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.22)" font-family="Poppins,system-ui" font-weight="600" letter-spacing="0.07em" transform="rotate(90,505,600)">WIESENTFELSER STR.</text>

          <!-- MARGARETE-VOLLMAR-STRASSE (horizontal Mitte) -->
          <rect x="38" y="370" width="290" height="38" fill="#141420"/>
          <line x1="38" y1="389" x2="328" y2="389" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="14,10"/>
          <text x="165" y="386" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.25)" font-family="Poppins,system-ui" font-weight="600" letter-spacing="0.07em">MARGARETE-VOLLMAR-STRASSE</text>

          <!-- EMILIE-MAURER-STRASSE (rechts von MK2(2)) -->
          <rect x="400" y="50" width="32" height="390" fill="#141420"/>
          <line x1="416" y1="50" x2="416" y2="440" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="14,10"/>
          <text x="416" y="245" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.22)" font-family="Poppins,system-ui" font-weight="600" letter-spacing="0.07em" transform="rotate(90,416,245)">EMILIE-MAURER-STRASSE</text>

          <!-- AMALJE-NACKEN-STRASSE (diagonal) -->
          <polygon points="248,50 270,50 248,440 218,370" fill="#141420"/>
          <line x1="248" y1="50" x2="218" y2="370" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" stroke-dasharray="12,9"/>
          <line x1="270" y1="50" x2="248" y2="440" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" stroke-dasharray="12,9"/>
          <text x="256" y="220" text-anchor="middle" font-size="6" fill="rgba(255,255,255,0.2)" font-family="Poppins,system-ui" font-weight="600" letter-spacing="0.06em" transform="rotate(-4,256,220)">AMALJE-NACKEN-STR.</text>

          <!-- ══ MK 2(1) ORANGE ══ -->
          <polygon points="38,50 248,50 218,370 38,370" fill="#92400e" filter="url(#shadow)"/>
          <polygon points="38,50 248,50 218,370 38,370" fill="#d97706" opacity="0.75"/>
          <polygon points="38,50 248,50 218,370 38,370" fill="url(#grid)" opacity="0.5"/>
          <!-- Gastro-Bereich unten -->
          <polygon points="38,258 228,258 218,370 38,370" fill="rgba(0,0,0,0.22)"/>
          <line x1="38" y1="258" x2="228" y2="258" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="8,5"/>
          <!-- Heatmap -->
          <ellipse cx="140" cy="155" rx="100" ry="90" fill="url(#hm-or)"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/></ellipse>
          <ellipse cx="130" cy="308" rx="80" ry="45" fill="url(#hm-or)"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/></ellipse>
          <!-- Label -->
          <text x="46" y="44" font-size="10" fill="rgba(253,186,116,0.95)" font-family="Poppins,system-ui" font-weight="800" letter-spacing="0.04em">MK 2(1)</text>
          <text x="133" y="155" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.35)" font-family="Poppins,system-ui" font-weight="700" letter-spacing="0.06em">NAHVERSORGUNG</text>
          <text x="128" y="316" text-anchor="middle" font-size="8.5" fill="rgba(253,186,116,0.55)" font-family="Poppins,system-ui" font-weight="700" letter-spacing="0.06em">GASTRO</text>
          <!-- Shops -->
          <rect x="50"  y="70"  width="85" height="48" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="92"  y="92"  text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)" font-family="Poppins,system-ui" font-weight="600">🛒 Supermarkt</text>
          <rect x="148" y="70"  width="80" height="48" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="188" y="92"  text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)" font-family="Poppins,system-ui" font-weight="600">💊 Apotheke</text>
          <rect x="50"  y="132" width="85" height="48" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="92"  y="154" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)" font-family="Poppins,system-ui" font-weight="600">🥦 Bio-Markt</text>
          <rect x="148" y="132" width="80" height="48" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="188" y="154" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)" font-family="Poppins,system-ui" font-weight="600">🏦 Bank</text>
          <rect x="50"  y="194" width="85" height="48" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="92"  y="216" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)" font-family="Poppins,system-ui" font-weight="600">📚 Bücher</text>
          <rect x="148" y="194" width="80" height="48" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
          <text x="188" y="216" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.4)" font-family="Poppins,system-ui" font-weight="600">👓 Optiker</text>
          <rect x="50"  y="272" width="95" height="44" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(253,186,116,0.15)" stroke-width="1"/>
          <text x="97"  y="292" text-anchor="middle" font-size="7.5" fill="rgba(253,186,116,0.5)" font-family="Poppins,system-ui" font-weight="600">☕ Café Freiham</text>
          <rect x="158" y="272" width="70" height="44" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(253,186,116,0.15)" stroke-width="1"/>
          <text x="193" y="292" text-anchor="middle" font-size="7.5" fill="rgba(253,186,116,0.5)" font-family="Poppins,system-ui" font-weight="600">🥙 Levante</text>

// PAN/ZOOM — clean, rAF-based, with momentum + proper pinch
const MAP_W=520, MAP_H=800, MIN_S=0.35, MAX_S=4;
let tx=0, ty=0, scale=1;
let rafId=null, momRAF=null;
let vx=0, vy=0;
let dragging=false, lastX=0, lastY=0, lastT=0, hasMoved=false;
let pinching=false, pinchDist=0, pinchCx=0, pinchCy=0;

const wrap=document.getElementById('map-wrap');
const stage=document.getElementById('map-stage');

function applyT(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function scheduleT(){if(!rafId)rafId=requestAnimationFrame(()=>{rafId=null;applyT()})}

function clamp(){
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const mw=MAP_W*scale, mh=MAP_H*scale;
  tx = mw<W ? (W-mw)/2 : Math.min(0, Math.max(W-mw, tx));
  ty = mh<H ? (H-mh)/2 : Math.min(0, Math.max(H-mh, ty));
}

function mapZoom(f,cx,cy){
  cx=cx??wrap.clientWidth/2; cy=cy??wrap.clientHeight/2;
  const ns=Math.min(MAX_S,Math.max(MIN_S,scale*f));
  if(ns===scale)return;
  tx=cx-(cx-tx)*(ns/scale);
  ty=cy-(cy-ty)*(ns/scale);
  scale=ns; clamp(); scheduleT();
}

function cancelMomentum(){if(momRAF){cancelAnimationFrame(momRAF);momRAF=null}vx=0;vy=0}
function startMomentum(){
  cancelMomentum();
  const decay=0.88;
  (function step(){
    vx*=decay; vy*=decay;
    if(Math.abs(vx)<0.4&&Math.abs(vy)<0.4)return;
    tx+=vx; ty+=vy; clamp(); scheduleT();
    momRAF=requestAnimationFrame(step);
  })();
}

// Mouse
wrap.addEventListener('mousedown',e=>{
  if(e.button)return;
  cancelMomentum();
  dragging=true; hasMoved=false;
  lastX=e.clientX; lastY=e.clientY; lastT=Date.now(); vx=0; vy=0;
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY, dt=Date.now()-lastT||1;
  tx+=dx; ty+=dy; clamp(); scheduleT();
  vx=dx/(dt/16); vy=dy/(dt/16);
  lastX=e.clientX; lastY=e.clientY; lastT=Date.now();
  if(Math.abs(dx)+Math.abs(dy)>4)hasMoved=true;
});
window.addEventListener('mouseup',()=>{if(dragging){dragging=false;startMomentum()}});
wrap.addEventListener('click',e=>{if(hasMoved)e.stopPropagation()},{capture:true});
wrap.addEventListener('wheel',e=>{
  e.preventDefault(); cancelMomentum();
  mapZoom(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY);
},{passive:false});

// Touch
wrap.addEventListener('touchstart',e=>{
  cancelMomentum();
  if(e.touches.length===1){
    dragging=true; pinching=false; hasMoved=false;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; lastT=Date.now(); vx=0; vy=0;
  } else if(e.touches.length===2){
    dragging=false; pinching=true; hasMoved=true;
    pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchCx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    pinchCy=(e.touches[0].clientY+e.touches[1].clientY)/2;
  }
},{passive:true});

wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(dragging&&e.touches.length===1){
    const dx=e.touches[0].clientX-lastX, dy=e.touches[0].clientY-lastY, dt=Date.now()-lastT||1;
    tx+=dx; ty+=dy; clamp(); scheduleT();
    vx=dx/(dt/16); vy=dy/(dt/16);
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; lastT=Date.now();
    if(Math.abs(dx)+Math.abs(dy)>4)hasMoved=true;
  } else if(pinching&&e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    // Pan with pinch midpoint
    tx+=cx-pinchCx; ty+=cy-pinchCy;
    // Zoom towards midpoint
    const ns=Math.min(MAX_S,Math.max(MIN_S,scale*(d/pinchDist)));
    tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale);
    scale=ns; clamp(); scheduleT();
    pinchDist=d; pinchCx=cx; pinchCy=cy;
  }
},{passive:false});

wrap.addEventListener('touchend',e=>{
  if(e.touches.length===0){
    if(dragging)startMomentum();
    dragging=false; pinching=false;
  } else if(e.touches.length===1&&pinching){
    // Back to single finger after pinch — reset cleanly
    pinching=false; dragging=true; hasMoved=true;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; lastT=Date.now(); vx=0; vy=0;
  }
},{passive:true});

}

function nudgeUser(id,name){
  const api=window.ZAMApi;
  let msg='';
  if(api){
    const result=api.nudges.send(id,name);
    msg=result?`${name} wird benachrichtigt.`:'Anfrage bereits gesendet oder bereits verbunden.';
  } else {
    msg=`${name} wird benachrichtigt.`;
  }
  closePopup();
  setTimeout(()=>{
    document.getElementById('pop-content').innerHTML=`<div style="text-align:center;padding:10px 0"><div style="font-size:2rem;margin-bottom:10px">👋</div><div style="font-size:0.95rem;font-weight:700;color:#fff;margin-bottom:6px">Anstupsanfrage gesendet!</div><div style="font-size:0.76rem;color:rgba(255,255,255,0.5)">${msg}</div><button onclick="closePopup()" style="margin-top:16px;width:100%;background:linear-gradient(135deg,#6d28d9,#8b5cf6);border-radius:10px;padding:10px;color:#fff;font-size:0.8rem;font-weight:700;font-family:Poppins,system-ui;cursor:pointer">OK</button></div>`;
    showPopup();
  },100);
}
